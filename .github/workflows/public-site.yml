name: public research site

on:
  push:
    paths:
      - 'site/**'
      - 'scripts/check_public_site.py'
      - '.github/workflows/public-site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/check_public_site.py'
      - '.github/workflows/public-site.yml'

jobs:
  static-site-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate accessible markup, links, assets and policies
        run: python scripts/check_public_site.py
