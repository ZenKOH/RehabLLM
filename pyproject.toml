[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rehab-minillm"
version = "0.1.0"
description = "A small decoder-only language model for rehabilitation and rehabilitation robotics, built from scratch in PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Zen KOH"}]
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "sentencepiece>=0.2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
