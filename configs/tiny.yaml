model:
  vocab_size: 8000
  context_length: 256
  n_layers: 4
  n_heads: 4
  d_model: 256
  d_ff: 1024
  dropout: 0.1
  bias: false
  tie_embeddings: true

training:
  batch_size: 16
  gradient_accumulation_steps: 1
  max_steps: 2000
  learning_rate: 0.0004
  min_learning_rate: 0.00004
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 200
  eval_batches: 20
  checkpoint_interval: 500
  seed: 42
  amp: true
