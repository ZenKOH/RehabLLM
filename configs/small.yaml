model:
  vocab_size: 8000
  context_length: 512
  n_layers: 8
  n_heads: 6
  d_model: 384
  d_ff: 1536
  dropout: 0.1
  bias: false
  tie_embeddings: true

training:
  batch_size: 16
  gradient_accumulation_steps: 4
  max_steps: 50000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_batches: 50
  checkpoint_interval: 2500
  seed: 42
  amp: true
