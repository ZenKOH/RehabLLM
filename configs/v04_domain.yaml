model:
  vocab_size: 8000
  context_length: 512
  n_layers: 8
  n_heads: 6
  d_model: 384
  d_ff: 1536
  dropout: 0.1
  bias: false
  tie_embeddings: true

training:
  batch_size: 16
  gradient_accumulation_steps: 4
  max_steps: 1500
  learning_rate: 0.00015
  min_learning_rate: 0.000015
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 125
  eval_batches: 25
  checkpoint_interval: 250
  seed: 42
  amp: true
