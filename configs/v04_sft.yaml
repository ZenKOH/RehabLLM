model:
  vocab_size: 8000
  context_length: 512
  n_layers: 8
  n_heads: 6
  d_model: 384
  d_ff: 1536
  dropout: 0.1
  bias: false
  tie_embeddings: true

training:
  batch_size: 8
  gradient_accumulation_steps: 2
  max_steps: 500
  learning_rate: 0.00005
  min_learning_rate: 0.000005
  warmup_steps: 30
  weight_decay: 0.01
  grad_clip: 1.0
  eval_interval: 50
  eval_batches: 20
  checkpoint_interval: 100
  seed: 42
  amp: true
